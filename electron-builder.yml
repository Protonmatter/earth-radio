appId: com.protonmatter.earthradio
productName: Earth Radio
copyright: Copyright © 2026 Protonmatter
files:
  - site/**
  - electron/**
  - server/**
  - '!server/example-proxy.mjs'
  - package.json
asar: true
beforePack: scripts/desktop-package-compat.mjs
asarUnpack:
  - server/**
directories:
  output: release
win:
  icon: site/branding/earth-radio-desktop.ico
  target:
    - nsis
    - portable
  artifactName: EarthRadio-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Audio
  artifactName: EarthRadio-${version}-${arch}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.music
  artifactName: EarthRadio-${version}-${arch}.${ext}
nsis:
  artifactName: EarthRadio-Setup-${version}-${arch}.${ext}
  # Both targets share an archive cache. Use the hook's legacy-compatible BCJ
  # filter for both, rather than mixing ZIP/7z payloads in one builder run.
  useZip: false
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: EarthRadio-Portable-${version}-${arch}.${ext}
